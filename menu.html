<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eatsify - Menu (Coming Soon)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #edede8;
      font-family: 'Bellefair', serif;
      text-align: center;
      color: #333;
    }
    .logo {
      width: 300px;
      max-width: 80vw;
      margin-bottom: 2rem;
      filter: drop-shadow(0px 0px 1px rgba(0,0,0,0.5)); /* slight thickening for consistency */
    }
    h1 {
      font-size: 4rem;
      margin: 0 0 1rem 0;
    }
    p {
      font-size: 1.5rem;
      color: #555;
    }
    .btn {
      margin-top: 3rem;
      display: inline-block;
      text-decoration: none;
      color: #111;
      border: 1px solid #111;
      padding: 10px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      transition: all 0.3s;
    }
    .btn:hover {
      background-color: #111;
      color: #fff;
    }
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      p { font-size: 1.2rem; padding: 0 20px; }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Eatsify Logo" class="logo" />
  <h1>Menu Under Construction</h1>
  <p>We are currently crafting a delicious new menu for you.<br/>Please check back soon!</p>
  <a href="index.html" class="btn">Return to Home</a>
</body>
</html>
